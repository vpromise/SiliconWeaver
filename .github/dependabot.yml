version: 2
updates:
  - package-ecosystem: pip
    directory: /pi-lane
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pi-lane-python-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      pi-lane-python-development:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /pi-lane
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pi-lane-agent-runtime:
        patterns:
          - "@earendil-works/pi-*"
        update-types:
          - minor
          - patch
      pi-lane-node-development:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "@earendil-works/pi-*"
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /rtl-closure
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      rtl-closure-python-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      rtl-closure-python-development:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
