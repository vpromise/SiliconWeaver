version: 2
updates:
  - package-ecosystem: pip
    directory: /pi-lane
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pi-lane-python:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /pi-lane
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pi-lane-node:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /rtl-closure
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      rtl-closure-python:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
